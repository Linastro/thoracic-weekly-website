services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: thoracic-server-api:local
    container_name: thoracic-api
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - thoracic-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8080"

  cron:
    build:
      context: .
      dockerfile: cron/Dockerfile
    image: thoracic-server-cron:local
    container_name: thoracic-cron
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - thoracic-data:/data
      - web_dist:/app/web_dist     # cron build 输出 → web 容器读
      # web 源码 bind mount:改前端免重建 cron 镜像(1.6G 机器上重建会卡死)。
      # 依赖宿主机 ~/thoracic-server/web/node_modules 存在(从镜像拷一次即可);
      # 容器内 npm run build 读 /data/snapshots(thoracic-data 卷),不需要 web/data 软链。
      - ./web:/app/web_src
    depends_on:
      api:
        condition: service_healthy
    # supercronic 作为 PID 1 会启用自带 reaper,而该 reaper fork exec 失败导致进程 fatal 退出。
    # 交给 docker 自带 init 当 PID 1,supercronic 检测到自己非 PID 1 即关闭 reaping。
    init: true
    command: ["supercronic", "/etc/crontab"]

  web:
    image: nginx:1.27-alpine
    container_name: thoracic-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # nocopy:禁止 docker 把 nginx 镜像自带的默认欢迎页灌进空的 web_dist volume,
      # 否则会污染 cron 的构建产物目录。
      - type: volume
        source: web_dist
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  thoracic-data:    # SQLite + snapshot 持久化
  web_dist:         # cron build 输出,web 容器从这里读取
