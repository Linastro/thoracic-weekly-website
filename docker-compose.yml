services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: thoracic-server-api:local
    container_name: thoracic-api
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - thoracic-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8080"

  cron:
    build:
      context: .
      dockerfile: cron/Dockerfile
    image: thoracic-server-cron:local
    container_name: thoracic-cron
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - thoracic-data:/data
      - web_dist:/app/web_dist     # cron build 输出 → web 容器读
    depends_on:
      api:
        condition: service_healthy
    command: ["supercronic", "/etc/crontab"]

  web:
    image: nginx:1.27-alpine
    container_name: thoracic-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - web_dist:/usr/share/nginx/html:ro    # 从 named volume 读(ro)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  thoracic-data:    # SQLite + snapshot 持久化
  web_dist:         # cron build 输出,web 容器从这里读取
