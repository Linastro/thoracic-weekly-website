[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thoracic-server"
version = "0.1.0"
description = "Thoracic Weekly Server — daily PubMed thoracic literature monitor (local-first preview)."
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
]

[tool.setuptools.packages.find]
where = ["api/src"]
include = ["thoracic*"]

[tool.uv]
workspace = { members = ["api"] }
